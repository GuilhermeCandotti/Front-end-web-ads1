<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="=viewport" content="widt==device-widht initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./images/block.png" type="image/x-icon" />
    <title>Conhecendo os displays</title>
  </head>
  <body>
    <header>
      <h1>Conhecendo os displays do CSS</h1>
    </header>
    <main>
      <section>
        <h2>Display block</h2>
        <div class="container-block">
          <div class="item">item 1</div>
          <div class="item">item 2</div>
          <div class="item">item 3</div>
        </div>
        <p>elemntos são blocos que ocupam a linha toda</p>
      </section>
      <section>
        <h2>Display inline</h2>
        <div class="container-inline-block">
          <div class="item">item 1</div>
          <div class="item">item 2</div>
          <div class="item">item 3</div>
        </div>
        <p>elemntos ficam em linha mas se comportão como blocos</p>
      </section>
    </main>
    <footer><p>projeto de compreensão de displays no CSS</p></footer>
  </body>
</html>
